name: Publish Rekenreis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish iPad app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare JavaScript tester
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check world-progress.js
          node --check bilingual-instructions.js
          node bilingual-instructions.test.cjs
          node --check app.js
          node --check voice-engine.js
          node --check spelling-coach.js
          node --check pet-studio.js
          node --check forest-game.js
          node --check letterblaster.js
          node v2-adventure.test.cjs
          node --check pet-play.js
          node world-progress.test.cjs
          node --check dictee.js
          node --check woordpakketten.js
          node --check dictee-v2.js
          node --check arcade-invaders.js
          node --check arcade-breakout.js
          node --check arcade-hub.js
          node arcade-v3.test.cjs
          node dictee-bonus.test.cjs
          node --check retro-game.js
          node dictee-v2.test.cjs
          node --check memory-game.js
          node --check activities.js
          node --check rewards.js
          node --check pet-core.js
          node --check pet-world.js
          node --check pet-entry.js
          node --check install-mobile.js
          node pet-core.test.cjs
          node rewards.test.cjs
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Generate PWA and Apple touch icons
        run: python scripts/build_icons.py
      - name: Cache Flemish audio recordings
        uses: actions/cache@v4
        with:
          path: _audio_cache
          key: flemish-audio-v1-${{ hashFiles('woordpakketten.js') }}
      - name: Prepare Flemish neural speech
        run: |
          node scripts/export_voice_data.cjs
          python -m pip install edge-tts
      - name: Generate Belgian Dutch recordings (best effort)
        timeout-minutes: 10
        continue-on-error: true
        run: python scripts/build_flemish_audio.py
      - name: Collect static web app
        run: |
          mkdir -p _site/icons _site/audio/nl-BE
          cp index.html bilingual-instructions.js arcade-invaders.js arcade-breakout.js arcade-hub.js spelling-coach.js pet-studio.js forest-game.js letterblaster.js world-progress.js app.js pet-play.js dictee.js woordpakketten.js dictee-v2.js retro-game.js memory-game.js activities.js rewards.js pet-core.js pet-world.js pet-entry.js install-mobile.js style.css adventures.css rewards.css pet-world.css pet-home-install.css dictee-v2.css interactive-pet.css pet-studio.css forest-game.css games-coach.css arcade-v3.css bilingual-instructions.css sw.js manifest.webmanifest _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png _site/icons/
          if test -d _audio_cache; then find _audio_cache -maxdepth 1 -type f \( -name '*.mp3' -o -name 'manifest.json' \) -exec cp {} _site/audio/nl-BE/ \;; fi
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
