name: Publish Rekenreis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish iPad app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare JavaScript tester
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check dictee.js
          node --check woordpakketten.js
          node --check dictee-v2.js
          node --check retro-game.js
          node dictee-v2.test.cjs
          node --check memory-game.js
          node --check activities.js
          node --check rewards.js
          node --check pet-core.js
          node --check pet-world.js
          node --check pet-entry.js
          node --check install-mobile.js
          node pet-core.test.cjs
          node rewards.test.cjs
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Generate PWA and Apple touch icons
        run: python scripts/build_icons.py
      - name: Collect static web app
        run: |
          mkdir -p _site/icons
          cp index.html app.js dictee.js woordpakketten.js dictee-v2.js retro-game.js memory-game.js activities.js rewards.js pet-core.js pet-world.js pet-entry.js install-mobile.js style.css adventures.css rewards.css pet-world.css pet-home-install.css dictee-v2.css sw.js manifest.webmanifest _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png _site/icons/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
